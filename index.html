<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareChart Academic EHR — Student Playground</title>
<style>
:root{
  --ink:#1d2733; --muted:#5d6b7a; --line:#d5dde5; --bg:#eef2f5; --panel:#fff;
  --top:#16323f; --top2:#22495a; --accent:#0f7c86; --accent-soft:#e2f3f4;
  --red:#b42318; --red-soft:#fde8e6; --amber:#9a5b00; --amber-soft:#fff3d6;
  --green:#18794e; --green-soft:#e3f5ea; --blue:#1b5fa8; --blue-soft:#e6effa;
}
*{box-sizing:border-box}
body{margin:0;font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:4px;padding:4px 10px;color:var(--ink)}
button:hover{background:#f4f7f9}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.pri:hover{background:#0b6870}
button.danger{background:var(--red);border-color:var(--red);color:#fff}
button.warnb{background:var(--amber-soft);border-color:#e6c27a}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;border:1px solid #b9c5d0;border-radius:3px;padding:4px 6px;background:#fff;color:var(--ink)}
textarea{width:100%;resize:vertical}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
th{background:#f3f6f8;font-weight:600;font-size:12px;color:#3c4a58}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:13px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em;color:#3c4a58}
.top{background:var(--top);color:#fff;display:flex;align-items:center;gap:14px;padding:6px 12px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.02em}
.brand small{font-weight:400;opacity:.75;margin-left:6px}
.simtag{background:#f6c344;color:#3a2a00;font-weight:700;font-size:11px;padding:2px 7px;border-radius:3px}
.top .sp{flex:1}
.clock{display:flex;align-items:center;gap:6px;background:var(--top2);padding:3px 8px;border-radius:4px}
.clock b{font-variant-numeric:tabular-nums;font-size:14px}
.top button{background:transparent;color:#fff;border-color:#4d7383;padding:2px 8px}
.top button:hover{background:#2c5a6c}
.tabs{display:flex;background:var(--top2);padding:0 8px;gap:2px;overflow-x:auto}
.tab{color:#d8e6eb;padding:6px 12px;cursor:pointer;border-radius:4px 4px 0 0;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab.on{background:var(--bg);color:var(--ink);font-weight:600}
.tab .x{opacity:.6}.tab .x:hover{opacity:1}
.banner{background:#fff;border-bottom:3px solid var(--accent);padding:8px 14px;display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.banner .nm{font-size:18px;font-weight:700}
.banner .sub{color:var(--muted)}
.bfield{min-width:110px}
.bfield .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.allergy{background:var(--red-soft);color:var(--red);border:1px solid #f3b8b2;padding:3px 8px;border-radius:4px;font-weight:600}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600}
.p-red{background:var(--red-soft);color:var(--red)}.p-amb{background:var(--amber-soft);color:var(--amber)}
.p-grn{background:var(--green-soft);color:var(--green)}.p-blu{background:var(--blue-soft);color:var(--blue)}
.p-gry{background:#eceff2;color:#4b5866}
.wrap{display:flex;min-height:calc(100vh - 140px)}
.side{width:178px;background:#fff;border-right:1px solid var(--line);padding:8px 0;flex-shrink:0}
.side div{padding:7px 14px;cursor:pointer;border-left:3px solid transparent}
.side div:hover{background:#f3f7f9}
.side div.on{background:var(--accent-soft);border-left-color:var(--accent);font-weight:600}
.side .cnt{float:right}
.main{flex:1;padding:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:1fr}.side{width:130px}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:8px}
.hi{color:var(--red);font-weight:700}.lo{color:var(--blue);font-weight:700}
.muted{color:var(--muted)}
.msg{padding:8px 10px;border-radius:4px;margin:8px 0}
.m-red{background:var(--red-soft);color:var(--red);border:1px solid #f3b8b2}
.m-amb{background:var(--amber-soft);color:#6d4300;border:1px solid #f0d28d}
.m-grn{background:var(--green-soft);color:var(--green);border:1px solid #a8dcbf}
.m-blu{background:var(--blue-soft);color:var(--blue);border:1px solid #b5cdea}
.fs td,.fs th{text-align:center;font-variant-numeric:tabular-nums}
.fs td:first-child,.fs th:first-child{text-align:left}
.cell{display:inline-block;min-width:54px;padding:2px 6px;border-radius:3px;font-size:12px}
.c-given{background:var(--green-soft);color:var(--green)}
.c-held{background:#eceff2;color:#4b5866}
.c-due{background:var(--amber-soft);color:var(--amber);font-weight:700}
.c-over{background:var(--red-soft);color:var(--red);font-weight:700}
.c-up{background:#f4f6f8;color:#4b5866}
.medname{font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(15,30,40,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:8px;max-width:680px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal .mh{padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between}
.modal .mb{padding:14px}
.modal .mf{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.drawer button{display:block;width:100%;text-align:left;margin-bottom:4px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--muted)}
.note{border:1px solid var(--line);border-radius:4px;padding:8px;margin-bottom:8px;white-space:pre-wrap}
.note .nh{font-weight:600;margin-bottom:4px;white-space:normal}
.list tr{cursor:pointer}.list tr:hover td{background:#f6fafb}
.steps{display:flex;gap:6px;margin-bottom:10px}
.steps span{flex:1;text-align:center;padding:4px;border-radius:4px;background:#eef2f5;font-size:12px}
.steps span.ok{background:var(--green-soft);color:var(--green);font-weight:600}
.subtabs{display:flex;gap:4px;margin-bottom:10px}
.subtabs button.on{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.foot{color:var(--muted);font-size:11px;text-align:center;padding:10px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>

/* ---------- State ---------- */
const KEY='carechart-academic-v2';
const clone=o=>JSON.parse(JSON.stringify(o));
function freshPt(p){return {vitals:clone(p.vitals),assess:[],io:clone(p.io),notes:clone(p.notes),admins:clone(p.admins),care:clone(p.care),acked:[],protoMeds:[],labOrd:[],labsAdd:[],ords:[],pendDyn:[],dc:[],sep:{state:'none'},lyte:null,devices:[seedPiv(p.id)].filter(Boolean),pivSeed:true,adm:null};}
function fresh(){const s={clock:450,user:'',pt:{}};PATIENTS.forEach(p=>s.pt[p.id]=freshPt(p));return s;}
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S=load()||fresh();
PATIENTS.forEach(p=>{const d=S.pt[p.id];if(d&&!d.pivSeed){d.devices=d.devices||[];const sd=seedPiv(p.id);if(sd)d.devices.unshift(sd);d.pivSeed=true;}});
const UI={open:[],active:null,act:'summary',wrist:{},sub:{}};
const D=()=>S.pt[UI.active];

/* ---------- Clinical helpers ---------- */
function latestV(id,field){const v=[...S.pt[id].vitals].sort((a,b)=>b.t-a.t).find(x=>x[field]!==undefined&&x[field]!=='');return v?{val:v[field],t:v.t,row:v}:null;}
function flag(f,v){if(v===''||v==null)return'';v=+v;
 const r={temp:[36,38],hr:[60,100],rr:[12,20],sbp:[90,140],dbp:[60,90],spo2:[92,101],pain:[-1,3]}[f];
 if(!r)return'';if(v<r[0])return'lo';if(v>r[1])return'hi';return'';}
function medList(id){const p=P(id),d=S.pt[id];const dc=d.dc||[];return [...p.meds.filter(m=>(!m.pendingOrder||d.acked.includes(m.pendingOrder))&&!dc.includes(m.id)),...(d.protoMeds||[]).filter(m=>!dc.includes(m.id))];}
function instances(id,m){const day=Math.floor(S.clock/DAY);
 if(m.type==='once'){const ack=m.dueAt??S.pt[id].ackT?.[m.pendingOrder]??S.clock;return [{key:`${m.id}@once`,due:ack,label:'Once'}];}
 if(m.type!=='sched')return[];
 return m.times.map(t=>({key:`${m.id}@${day}-${t}`,due:day*DAY+hm(t),label:t}));}
function instStatus(id,inst){const a=S.pt[id].admins.find(x=>x.key===inst.key);
 if(a)return{cls:a.status==='given'?'c-given':'c-held',txt:(a.status==='given'?'Given ':'Held ')+fmtHM(a.t),a};
 const diff=S.clock-inst.due;
 if(diff>60)return{cls:'c-over',txt:'OVERDUE'};
 if(diff>=-60)return{cls:'c-due',txt:'Due'};
 return{cls:'c-up',txt:'—'};}
function dueCount(id){let n=0;medList(id).forEach(m=>instances(id,m).forEach(i=>{const s=instStatus(id,i);if(s.cls==='c-over'||s.cls==='c-due')n++;}));return n;}
function lastGiven(id,medId){return S.pt[id].admins.filter(a=>a.med===medId&&a.status==='given').sort((a,b)=>b.t-a.t)[0];}
function reassessTasks(id){const d=S.pt[id],p=P(id);const out=[];
 d.admins.filter(a=>a.status==='given'&&a.pain!=null).forEach(a=>{const m=medById(p.id,a.med);if(!m)return;
  const win=/IV/.test(m.route)?30:60;const due=a.t+win;
  const done=d.vitals.some(v=>v.t>a.t&&v.pain!==undefined&&v.pain!=='');
  out.push({txt:`Pain reassessment after ${m.name} (${fmtHM(a.t)})`,due,done,over:!done&&S.clock>due+15});});
 return out;}
function sliding(bg){bg=+bg;if(bg<70)return{u:0,msg:'Hypoglycemia: HOLD insulin and treat per hypoglycemia protocol.'};
 if(bg<=150)return{u:0};if(bg<=200)return{u:2};if(bg<=250)return{u:4};if(bg<=300)return{u:6};if(bg<=350)return{u:8};if(bg<=400)return{u:10};return{u:10,msg:'BG > 400: give 10 units and notify provider.'};}

 const app=document.getElementById('app');
 let h=`<div class="top"><span class="brand">CareChart<small>Academic EHR</small></span><span class="simtag">SIMULATION · FICTIONAL PATIENTS · NOT FOR CLINICAL USE</span><span class="sp"></span>

function tick(m){S.clock+=m;save();render();}
function goList(){UI.active=null;UI.labels=false;render();}
function openPt(id){UI.labels=false;if(!UI.open.includes(id))UI.open.push(id);if(UI.active!==id){UI.act='summary';UI.sub={};}UI.active=id;render();setTimeout(()=>checkSepsis(id),60);}
function closePt(id){UI.open=UI.open.filter(x=>x!==id);delete UI.wrist[id];if(UI.active===id)UI.active=null;render();}
function setAct(a){UI.act=a;render();window.scrollTo(0,0);}

 return `<div class="main"><div class="card"><h2>My Patients — Unit 4W/5S</h2><table class="list"><tr><th>Room</th><th>Patient</th><th>Diagnosis</th><th>Attending</th><th>Alerts</th><th>Tasks</th></tr>${rows}</table>
 <p class="muted" style="margin-top:10px">Click a patient to open the chart. Use <b>+15m / +1h</b> to advance simulation time — medications become due and overdue based on sim time.</p></div></div>`;}

 const tasks=[...reassessTasks(p.id).filter(t=>!t.done),...cathTasks(p.id).map(t=>({...t,due:null})),...pivTasks(p.id).map(t=>({...t,due:null})),...d.labOrd.filter(o=>o.coll==null&&labDue(p.id,o)!=null&&labDue(p.id,o)<=S.clock+30).map(o=>({txt:`Lab due: ${o.test} — ${o.why} (Orders › Labs & specimens)`,over:S.clock>labDue(p.id,o)+30,due:null}))];

function vVitals(){const p=P(UI.active),d=D();const cols=[...d.vitals].sort((a,b)=>a.t-b.t).slice(-8);
 const rows=[['temp','Temp (°C)'],['hr','Heart rate'],['rr','Resp rate'],['bp','BP (mmHg)'],['spo2','SpO₂ (%)'],['o2','O₂ device'],['pain','Pain (0–10)'],['loc','Pain location'],['by','Documented by']];
 const cell=(v,k)=>{if(k==='by')return esc(v.by)+(v.ct&&v.ct-v.t>30?`<div><span class="pill p-amb">late · ${fmtHM(v.ct)}</span></div>`:'');if(k==='bp')return v.sbp!==undefined&&v.sbp!==''?`<span class="${flag('sbp',v.sbp)||flag('dbp',v.dbp)}">${v.sbp}/${v.dbp}</span>`:'';
  const x=v[k];if(x===undefined||x==='')return '';return `<span class="${flag(k,x)}">${esc(x)}</span>`;};
 const grid=`<div style="overflow-x:auto"><table class="fs"><tr><th>Measure</th>${cols.map(c=>`<th>${fmtT(c.t)}</th>`).join('')}</tr>${rows.map(([k,l])=>`<tr><td>${l}</td>${cols.map(c=>`<td>${cell(c,k)}</td>`).join('')}</tr>`).join('')}</table></div>`;
 return `<div class="card"><h2>Vital Signs Flowsheet</h2>${grid}<p class="muted">Red = above range · Blue = below range. Showing the 8 most recent columns.</p></div>
 <div class="card"><h3>Document vital signs</h3>
 <div class="row"><div><label>Time</label><input id="vt" value="${fmtHM(S.clock)}" size="5"></div>
 <div><label>Temp °C</label><input id="vtemp" size="5"></div><div><label>HR</label><input id="vhr" size="4"></div><div><label>RR</label><input id="vrr" size="4"></div>
 <div><label>SBP</label><input id="vsbp" size="4"></div><div><label>DBP</label><input id="vdbp" size="4"></div><div><label>SpO₂ %</label><input id="vspo2" size="4"></div>
 <div><label>O₂ device</label><select id="vo2"><option>RA</option><option>NC 1 L</option><option>NC 2 L</option><option>NC 3 L</option><option>NC 4 L</option><option>Simple mask</option><option>NRB</option></select></div>
 <div><label>Pain 0–10</label><input id="vpain" size="3"></div><div><label>Pain location</label><input id="vloc" size="14"></div></div>
 <div id="verr"></div><button class="pri" onclick="saveV()">File vitals</button> <span class="muted">Leave a field blank to skip it (e.g., pain-only reassessment).</span></div>`;}
function parseTime(s){s=(s||'').replace(':','');if(!/^\d{4}$/.test(s))return null;const day=Math.floor(S.clock/DAY);const m=day*DAY+hm(s);return m;}
function saveV(){const g=id=>document.getElementById(id).value.trim();const t=parseTime(g('vt'));
 if(t===null){document.getElementById('verr').innerHTML='<div class="msg m-red">Enter time as HHMM (e.g., 0815).</div>';return;}
 if(t>S.clock){document.getElementById('verr').innerHTML='<div class="msg m-red">You cannot document vitals in the future.</div>';return;}
 const v={id:uid(),t,ct:S.clock,by:me()};const nums=['temp','hr','rr','sbp','dbp','spo2','pain'];let any=false,bad=[];
 nums.forEach(k=>{const x=g('v'+k);if(x!==''){if(isNaN(+x))bad.push(k);else{v[k]=+x;any=true;}}});
 if(g('vpain')!==''&&(+g('vpain')<0||+g('vpain')>10))bad.push('pain (0–10)');
 if((v.sbp!==undefined)!==(v.dbp!==undefined))bad.push('BP needs both SBP and DBP');
 if(bad.length){document.getElementById('verr').innerHTML=`<div class="msg m-red">Check: ${bad.join(', ')}</div>`;return;}
 if(!any){document.getElementById('verr').innerHTML='<div class="msg m-red">Enter at least one value.</div>';return;}
 if(v.spo2!==undefined||v.hr!==undefined)v.o2=g('vo2');if(g('vloc'))v.loc=g('vloc');
 D().vitals.push(v);save();
 const alerts=nums.filter(k=>v[k]!==undefined&&flag(k,v[k])&&k!=='pain').map(k=>`${k.toUpperCase()} ${v[k]}`);
 render();setTimeout(()=>checkSepsis(UI.active),60);if(alerts.length)toast(`Abnormal value(s) filed: ${alerts.join(', ')}. Consider whether provider notification parameters are met (see Orders).`);}

function checks(f){const p=P(UI.active),d=D(),m=medById(p.id,M.medId);const hard=[],warn=[];const AT=f.xtime!==undefined?parseTime(f.xtime):S.clock;if(AT===null)hard.push('Enter the time given as HHMM.');else if(AT>S.clock)hard.push('Time given cannot be in the future.');else if(S.clock-AT>240)hard.push('Time given is more than 4 h ago — document a late-entry note and notify your instructor.');const NOW=AT??S.clock;

 if(m.ssi){if(f.xbg===''||isNaN(+f.xbg))hard.push('Enter the blood glucose.');else{const sc=sliding(f.xbg);
   if(f.xunits===''||isNaN(+f.xunits))hard.push('Enter units given (enter 0 if none).');

 {const pv=preVitals(m,f,AT);if(pv)D().vitals.push(pv);}

function ins(what){const p=P(UI.active),d=D();let s='';const day=Math.floor(S.clock/DAY);
 if(what==='vs'){const v=k=>latestV(p.id,k);const bp=v('sbp');s=`VS: T ${v('temp')?.val??'—'} °C, HR ${v('hr')?.val??'—'}, RR ${v('rr')?.val??'—'}, BP ${bp?bp.val+'/'+bp.row.dbp:'—'}, SpO2 ${v('spo2')?.val??'—'}% on ${v('o2')?.val??'—'}, pain ${v('pain')?.val??'—'}/10.`;}
 if(what==='meds'){s='Meds today: '+(d.admins.filter(a=>Math.floor(a.t/DAY)===day).sort((a,b)=>a.t-b.t).map(a=>`${fmtHM(a.t)} ${(medById(p.id,a.med)||{}).name} ${a.dose||''} (${a.status})`).join('; ')||'none')+'.';}
 if(what==='io'){const t=d.io.filter(x=>Math.floor(x.t/DAY)===day);const i=t.filter(x=>x.kind==='in').reduce((a,x)=>a+x.amt,0),o=t.filter(x=>x.kind==='out').reduce((a,x)=>a+x.amt,0);s=`I&O today: intake ${i} mL, output ${o} mL, net ${i-o>0?'+':''}${i-o} mL.`;}

function exportChart(){let out=`CareChart Academic — student charting export\nStudent: ${me()}\nSim time: ${fmtT(S.clock)}\n`;
 PATIENTS.forEach(p=>{const d=S.pt[p.id];const seedIds=new Set([...p.vitals,...p.io,...p.notes,...p.admins,...p.care].map(x=>x.id));
  const mine=a=>a.filter(x=>!seedIds.has(x.id));out+=`\n==== ${p.name} (MRN ${p.mrn}) ====\n`;
  mine(d.vitals).forEach(v=>out+=`VS ${fmtT(v.t)}: ${['temp','hr','rr','sbp','dbp','spo2','o2','pain','loc'].filter(k=>v[k]!==undefined).map(k=>k+' '+v[k]).join(', ')}\n`);
  d.assess.forEach(a=>out+=`Assessment ${fmtT(a.t)}:\n${a.narr||a.sys.map(s=>s.s+' '+s.st+(s.f?' ('+s.f+')':'')).join('; ')}${a.morse?'; Morse '+a.morse:''}${a.braden?'; Braden '+a.braden:''}\n`);
  mine(d.admins).forEach(a=>out+=`MAR ${fmtT(a.t)}: ${(medById(p.id,a.med)||{}).name} ${a.dose||''} — ${a.status}${a.site?' — '+a.site:''}${a.pain!=null?' — pain '+a.pain:''}${a.bg!=null?' — BG '+a.bg:''}${a.vit?' — '+a.vit:''}${a.reason?' — '+a.reason:''}\n`);
  mine(d.io).forEach(x=>out+=`I&O ${fmtT(x.t)}: ${x.kind} ${x.cat} ${x.amt} mL\n`);
  (d.acked||[]).forEach(o=>{const x=allPending(p.id).find(y=>y.id===o);if(x)out+=`Order acknowledged: ${x.text}\n`;});
  (d.scores||[]).forEach(r=>out+=`SAFETY ${fmtT(r.t)}: Morse ${r.morse??'—'}; Braden ${r.braden??'—'}; BMAT ${r.bmat||'—'}${(r.ints||[]).length?'; precautions: '+r.ints.join(', '):''}\n`);
  (d.ords||[]).forEach(o=>out+=`ORDER ${fmtT(o.t)} [${o.set}] ${o.text} — ${o.mode}${o.cm?' — '+o.cm:''}\n`);

  (d.devices||[]).forEach(o=>out+=`DEVICE ${o.type}: ${o.status}; indication: ${o.ind}${o.insT!=null?'; inserted '+fmtT(o.insT):''}${o.remT!=null?'; removed '+fmtT(o.remT):''}\n`);
  if(d.adm){out+=`ADMISSION: sections saved — ${Object.keys(d.adm.done).join(', ')||'none'}; home meds: ${d.adm.meds.map(m=>`${m.name} ${m.dose} ${m.route} ${m.freq} (${m.ind}; last dose ${m.last||'?'}; ${m.recon})`).join('; ')||'none'}\n`;}

/* ================= PROTOCOLS, ORDER SETS, LABS, SEPSIS ================= */
/* Simulation protocol values are modeled on the program's example order set. Verify thresholds/doses against clinical-partner policy. */
const HOSP='Sound View Teaching Hospital';
const kgOf=p=>parseFloat(p.wt);
function vancDose(p){const mg=Math.round(kgOf(p)*20/250)*250;return mg>=1000?(mg/1000)+' g':mg+' mg';}
const STOCK=[
 {code:'0245-0058-11',label:'Potassium chloride ER 20 mEq tablet'},
 {code:'99001-120-01',label:'Potassium chloride oral solution 20 mEq/15 mL'},
 {code:'99001-110-01',label:'Potassium chloride 10 mEq/100 mL IVPB (peripheral)'},
 {code:'99001-111-01',label:'Potassium chloride 20 mEq/100 mL IVPB — CENTRAL LINE ONLY'},
 {code:'99001-210-01',label:'Magnesium sulfate 2 g/50 mL IVPB'},
 {code:'99001-320-01',label:'K-Phos Neutral 250 mg tablet (8 mmol phosphorus)'},
 {code:'99001-310-01',label:'Sodium phosphates 15 mmol/250 mL IVPB'},
 {code:'99001-410-01',label:'Lactated Ringer’s 1,000 mL'},
 {code:'99001-510-01',label:'Piperacillin-tazobactam 4.5 g/100 mL IVPB',allergyAgent:/penicillin/i,allergyMsg:'ALLERGY ALERT: Piperacillin is a penicillin.'},
 {code:'99001-520-01',label:'Aztreonam 2 g/100 mL IVPB'}
];
const vancPkg=p=>({code:'VANC-'+p.mrn,label:`Vancomycin ${vancDose(p)} IVPB — pharmacy prepared for ${p.name}`});
function drawerOf(id){const p=P(id);const list=[...p.drawer];const seen=new Set(list.map(x=>x.code));
 [...STOCK,vancPkg(p)].forEach(x=>{if(!seen.has(x.code)){list.push({...x,stock:true});seen.add(x.code);}});return list;}
const matches=(x,m)=>!!((x.m&&x.m.includes(m.id))||(m.codes&&m.codes.includes(x.code)));
function medById(id,medId){return P(id).meds.find(x=>x.id===medId)||(S.pt[id].protoMeds||[]).find(x=>x.id===medId);}
function allPending(id){return [...P(id).pending,...(S.pt[id].pendDyn||[])];}
function openPending(id){const d=S.pt[id];return allPending(id).filter(o=>!d.acked.includes(o.id));}

/* ---------- Labs ---------- */
const TAT={'Lactate':20,'Blood cultures ×2':60,'CBC':45,'CMP':60,'Potassium':60,'Magnesium':60,'Phosphorus':60,'Urinalysis with reflex culture':60};
const DEFREF={Potassium:['mmol/L','3.5–5.0'],Magnesium:['mg/dL','1.7–2.2'],Phosphorus:['mg/dL','2.5–4.5'],Lactate:['mmol/L','0.5–2.0'],WBC:['K/µL','4.5–11.0'],Hemoglobin:['g/dL','12.0–17.5'],Platelets:['K/µL','150–400'],Sodium:['mmol/L','135–145'],Creatinine:['mg/dL','0.6–1.2'],Glucose:['mg/dL','70–99'],BUN:['mg/dL','7–20']};
function labsAll(id){const p=P(id);return [...p.labs.map(l=>({name:l[0],val:l[1],unit:l[2],ref:l[3],flag:l[4],t:300,base:true})),...(S.pt[id].labsAdd||[])];}
function latestLab(id,name,before=Infinity){return labsAll(id).filter(l=>l.name===name&&l.t<=before).sort((a,b)=>b.t-a.t)[0];}
function refFor(id,name){const b=P(id).labs.find(l=>l[0]===name);return b?{unit:b[2],ref:b[3]}:{unit:(DEFREF[name]||['',''])[0],ref:(DEFREF[name]||['',''])[1]};}
function flagCalc(ref,v){if(typeof v!=='number')return'';const m=String(ref).match(/([\d.]+)\s*[–-]\s*([\d.]+)/);if(m){if(v<+m[1])return'L';if(v>+m[2])return'H';return'';}const lt=String(ref).match(/<\s*([\d.]+)/);if(lt&&v>=+lt[1])return'H';return'';}
const r1=v=>Math.round(v*10)/10;
function vAt(id,f,t){const v=S.pt[id].vitals.filter(x=>x.t<=t&&x[f]!==undefined&&x[f]!=='').sort((a,b)=>b.t-a.t)[0];return v?+v[f]:null;}
function givenBetween(id,a,b,pred){return S.pt[id].admins.filter(x=>x.status==='given'&&x.t>a&&x.t<=b).map(x=>({x,m:medById(id,x.med)})).filter(o=>o.m&&pred(o.m));}
const DEC1=['Lactate','Potassium','Magnesium','Phosphorus','WBC','Creatinine','Hemoglobin'];
function mk(id,name,val){const r=refFor(id,name);return{name,val,vs:DEC1.includes(name)?Number(val).toFixed(1):String(val),unit:r.unit,ref:r.ref,flag:flagCalc(r.ref,val)};}
function genResults(id,o){const t=o.coll,d=S.pt[id];const out=[];
 const K=()=>{const pr=latestLab(id,'Potassium',t);let v=pr.val;givenBetween(id,pr.t,t,m=>m.k).forEach(g=>v+=g.m.k*0.01);v-=0.2*givenBetween(id,pr.t,t,m=>m.loop).length;return r1(Math.max(2.0,v));};
 if(o.test==='Lactate'){const sbp=vAt(id,'sbp',t)??120,hr=vAt(id,'hr',t)??80,tp=vAt(id,'temp',t)??37;
  const L=givenBetween(id,t-360,t,m=>m.fluid).reduce((s,g)=>s+(g.m.vol||0),0)/1000;
  let v=1.2+(sbp<90?1.6:sbp<100?0.8:0)+(hr>120?0.8:hr>110?0.4:0)+(tp>=39?0.4:0)-0.6*L;out.push(mk(id,'Lactate',r1(Math.max(0.8,v))));}
 if(o.test==='Potassium')out.push(mk(id,'Potassium',K()));
 if(o.test==='Magnesium'){const pr=latestLab(id,'Magnesium',t);let v=pr.val;givenBetween(id,pr.t,t,m=>m.mgG).forEach(g=>v+=g.m.mgG*0.15);out.push(mk(id,'Magnesium',r1(v)));}
 if(o.test==='Phosphorus'){const pr=latestLab(id,'Phosphorus',t);let v=pr.val;givenBetween(id,pr.t,t,m=>m.phos).forEach(g=>v+=g.m.phos*0.02);out.push(mk(id,'Phosphorus',r1(v)));}
 if(o.test==='CBC'){const sep=d.sep&&d.sep.state==='positive';out.push(mk(id,'WBC',r1(latestLab(id,'WBC',t).val+(sep?1.8:0.2))),mk(id,'Hemoglobin',latestLab(id,'Hemoglobin',t).val),mk(id,'Platelets',latestLab(id,'Platelets',t).val));}
 if(o.test==='CMP'){const sbp=vAt(id,'sbp',t)??120;out.push(mk(id,'Sodium',latestLab(id,'Sodium',t).val),mk(id,'Potassium',K()),mk(id,'Creatinine',r1(latestLab(id,'Creatinine',t).val+(sbp<90?0.3:0))),mk(id,'Glucose',latestLab(id,'Glucose',t).val));}
 if(o.test==='Blood cultures ×2')out.push({name:'Blood cultures ×2',val:'No growth to date (preliminary; final at 5 days)',unit:'',ref:'No growth',flag:''});

function scSt(){UI.sc=UI.sc||{};const id=UI.active;if(!UI.sc[id]){const p=P(id),d=D();const lastS=[...(d.scores||[])].sort((a,b)=>b.t-a.t)[0];
  const st={m:{},b:{},bm:[]};
  st.m.iv=d.devices.some(o=>o.kind==='piv'&&o.status==='in place')?1:0;st.m.dx=p.problems.length>1?1:0;st.auto=true;
  if(lastS){Object.assign(st.m,lastS.mI||{});Object.assign(st.b,lastS.bI||{});}UI.sc[id]=st;}return UI.sc[id];}
function morseTotal(st){return MORSE.every(i=>st.m[i.k]!=null)?MORSE.reduce((s,i)=>s+i.o[st.m[i.k]][1],0):null;}
function bradenTotal(st){return BRADEN.every(i=>st.b[i.k]!=null)?BRADEN.reduce((s,i)=>s+st.b[i.k],0):null;}
function bmatLevel(st){const r=st.bm;for(let i=0;i<BMAT.length;i++){if(r[i]==='fail')return BMAT[i].fail;if(r[i]!=='pass')return null;}return BMAT_PASS;}
function scSet(kind,k,v){const st=scSt();if(kind==='bm'){st.bm=st.bm.slice(0,k);st.bm[k]=v;}else st[kind][k]=v;render();}

 const tabs=[['morse',`Morse Fall Scale ${mt!=null?'· '+mt:''}`],['braden',`Braden Scale ${bt!=null?'· '+bt:''}`],['bmat',`BMAT ${bl?'· '+bl[0].replace(/ —.*/,''):''}`]].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="UI.sub.sc='${k}';render()">${l}</button>`).join('');

  <div class="row" style="margin-top:8px;align-items:center"><b>Total:</b> ${pill(mt,morseTier)}</div>${mt!=null?`<div class="msg m-blu">${esc(morseTier(mt)[2])}</div>`:''}<p class="muted" style="font-size:11px">Morse Fall Scale (Morse, 1989). Total 0–125; commonly used cutoffs 0–24 low, 25–44 moderate, ≥ 45 high — confirm your facility's cutoffs.</p>`;}
 if(tab==='braden'){b=`<div style="overflow-x:auto"><table>${BRADEN.map(i=>`<tr><td style="width:150px"><b>${esc(i.l)}</b><div class="muted" style="font-size:11px">${esc(i.sub)}</div></td>${i.o.map(o=>`<td style="padding:3px"><div onclick="scSet('b','${i.k}',${o[0]})" style="cursor:pointer;border:2px solid ${st.b[i.k]===o[0]?'var(--accent)':'var(--line)'};background:${st.b[i.k]===o[0]?'var(--accent-soft)':'#fff'};border-radius:6px;padding:6px;min-height:84px;font-size:12px"><b>${o[0]} — ${esc(o[1])}</b><div class="muted" style="font-size:11px;margin-top:2px">${esc(o[2])}</div></div></td>`).join('')}${i.o.length<4?'<td></td>':''}</tr>`).join('')}</table></div>
  <div class="row" style="margin-top:8px;align-items:center"><b>Total:</b> ${pill(bt,bradenTier)}</div>${bt!=null?`<div class="msg m-blu">${esc(bradenTier(bt)[2])}${st.b.nut<=2?' Nutrition subscale ≤ 2 — consider dietitian consult.':''}${st.b.moi<=2?' Moisture subscale ≤ 2 — barrier cream, prompt incontinence care, moisture-wicking pads.':''}</div>`:''}<p class="muted" style="font-size:11px">Braden Scale for Predicting Pressure Sore Risk (Bergstrom &amp; Braden). Descriptors abbreviated for this simulation; the official tool is copyrighted — use your facility's licensed version. Total 6–23; ≤ 18 = at risk.</p>`;}

function saveScores(silent){const st=scSt(),d=D();const mt=morseTotal(st),bt=bradenTotal(st),bl=bmatLevel(st);
 if(mt==null&&bt==null&&!bl){if(!silent)document.getElementById('scE').innerHTML='<div class="msg m-red">Complete at least one tool (all items) before filing.</div>';return null;}
 const ti=document.getElementById('scT');const tt=ti?parseTime(ti.value):S.clock;if(tt===null||tt>S.clock){if(!silent)document.getElementById('scE').innerHTML='<div class="msg m-red">Enter a valid time (HHMM), not in the future.</div>';return null;}

 const rec={id:uid(),t:tt,ct:S.clock,by:me(),ints,morse:mt,mI:{...st.m},braden:bt,bI:{...st.b},bmat:bl?bl[0]:null};d.scores=d.scores||[];d.scores.push(rec);st.auto=false;save();

 return `<h3>Pre-administration check</h3><div class="row">${f.join('')}</div><p class="muted">Last charted: HR ${lv('hr')} · SBP ${lv('sbp')} · RR ${lv('rr')} · SpO₂ ${lv('spo2')}. Enter current values.</p>`;}
function preCheck(pid,m,f,hard,warn){const F=preFields(m),info=drugInfo(m)||{};
 const need=[];if(F.has('HR')&&(f.xhr===''||isNaN(+f.xhr)))need.push('apical HR');if(F.has('SBP')&&(f.xsbp===''||f.xdbp===''||isNaN(+f.xsbp)))need.push('BP');if(F.has('RR')&&(f.xrr===''||isNaN(+f.xrr)))need.push('respiratory rate');if(F.has('SpO2')&&(f.xspo2===''||isNaN(+f.xspo2)))need.push('SpO₂');if(F.has('POSS')&&!f.xposs)need.push('sedation (POSS)');if(F.has('Reflex')&&!f.xrefl)need.push('patellar reflex');
 if(need.length){hard.push('Before giving, document: '+need.join(', ')+'.');return;}
 const val={HR:+f.xhr,SBP:+f.xsbp,RR:+f.xrr,SpO2:+f.xspo2,POSS:f.xposs?(f.xposs[0]==='S'?0:+f.xposs[0]):null,Reflex:f.xrefl};const seen=new Set();
 [...(m.holds||[]),...(info.holds||[])].forEach(h=>{const v=val[h.f];const hit=(h.lt!=null&&v<h.lt)||(h.gt!=null&&v>h.gt)||(h.eq!=null&&v===h.eq);const key=h.f+(h.lt??'')+(h.gt??'')+(h.eq??'');if(hit&&!seen.has(key)){seen.add(key);warn.push(h.msg||`Hold parameter met: ${h.f} ${v} < ${h.lt}. Hold the dose and notify the provider.`);}});}
function labCheck(pid,m,warn){const info=drugInfo(m);if(!info||!info.labs)return;info.labs.forEach(r=>{const L=latestLab(pid,r.lab);if(!L||typeof L.val!=='number')return;if((r.lt!=null&&L.val<r.lt)||(r.gt!=null&&L.val>r.gt))warn.push(`${r.msg} (latest ${r.lab} ${L.vs??L.val} at ${fmtT(L.t)})`);});}
function preSummary(m,f){const F=preFields(m),o=[];if(F.has('HR'))o.push('HR '+f.xhr);if(F.has('SBP'))o.push(`BP ${f.xsbp}/${f.xdbp}`);if(F.has('RR'))o.push('RR '+f.xrr);if(F.has('SpO2'))o.push('SpO₂ '+f.xspo2+'%');if(F.has('POSS'))o.push('POSS '+(f.xposs||'').split(' ')[0]);if(F.has('Reflex'))o.push('patellar reflex '+(f.xrefl||'').toLowerCase());return o.join(', ');}
function preVitals(m,f,t){const F=preFields(m),v={id:uid(),t,by:me()};let any=false;if(F.has('HR')&&f.xhr!==''){v.hr=+f.xhr;any=true;}if(F.has('SBP')&&f.xsbp!==''){v.sbp=+f.xsbp;v.dbp=+f.xdbp;any=true;}if(F.has('RR')&&f.xrr!==''){v.rr=+f.xrr;any=true;}if(F.has('SpO2')&&f.xspo2!==''){v.spo2=+f.xspo2;any=true;}return any?v:null;}
function drugCardHtml(m){const i=drugInfo(m);if(!i)return '<p class="muted">No reference entry for this medication in the simulation.</p>';
 const holds=[...(m.holds||[]).map(h=>`${h.f} < ${h.lt} (per order)`),...(i.holds||[]).map(h=>h.msg),...(i.labs||[]).map(l=>l.msg)];
 return `<div><b>${esc(i.cls)}</b> — ${esc(i.act)}</div>${holds.length?`<h3 style="margin-top:8px">Hold / notify parameters</h3><ul style="margin:0;padding-left:18px">${holds.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
 <h3 style="margin-top:8px">Monitor</h3><ul style="margin:0;padding-left:18px">${i.mon.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3 style="margin-top:8px">Nursing considerations</h3><ul style="margin:0;padding-left:18px">${i.nur.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
 <p class="muted" style="font-size:11px;margin-top:8px">Sources: ${esc(i.src.join('; '))}. Simulation summary — verify with a current drug reference and your facility's policies.</p>`;}
function drugCard(mid){const m=medById(UI.active,mid);modal('Drug information: '+esc(m.name),drugCardHtml(m),'<button class="pri" onclick="closeModal()">Close</button>');}

const tAt=id=>{const el=document.getElementById(id);const t=el?parseTime(el.value):S.clock;return(t===null||t>S.clock)?S.clock:t;};
const lateTag=(t,ct)=>ct&&ct-t>30?` <span class="pill p-amb">late entry · charted ${fmtHM(ct)}</span>`:'';
/* ---------- Hardware scanner support (keyboard-wedge scanners type the code + Enter) ---------- */
let SBUF='',SLAST=0;
document.addEventListener('keydown',e=>{const tg=e.target;if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.tagName==='SELECT'))return;
 if(document.getElementById('modal').innerHTML)return;
 const now=Date.now();if(now-SLAST>600)SBUF='';SLAST=now;
 if(e.key==='Enter'){const c=SBUF.trim();SBUF='';if(c.length>=4){e.preventDefault();globalScan(c);}return;}
 if(e.key.length===1)SBUF+=e.key;});
function pickInstance(id,m){if(m.type==='prn')return{key:null,due:null};
 const open=instances(id,m).filter(i=>!S.pt[id].admins.find(a=>a.key===i.key));if(!open.length)return null;
 open.sort((a,b)=>Math.abs(a.due-S.clock)-Math.abs(b.due-S.clock));return open[0];}
function globalScan(code){const up=code.toUpperCase();const pt=PATIENTS.find(x=>bandCode(x)===up);
 if(pt){if(!UI.active){openPt(pt.id);}UI.act='mar';render();scanBand(up);return;}
 if(!UI.active){toast('Open a patient chart (or scan a wristband) before scanning medications.');return;}
 const p=P(UI.active);
 if(!UI.wrist[p.id]){UI.act='mar';render();toast('Scan the patient\'s wristband before scanning medications.');return;}
 const i=findInDrawer(p,code);
 if(i<0){UI.act='mar';render();if(PATIENTS.some(x=>findInDrawer(x,code)>=0))modal('Scan alert',`<div class="msg m-red"><b>⚠ Not this patient's medication.</b> Barcode ${esc(code)} is stocked for another patient.</div>`,'<button onclick="closeModal()">OK</button>');else toast('Barcode not recognized: '+code);return;}
 const x=drawerOf(p.id)[i];
 if(x.allergy||!medList(p.id).some(m=>matches(x,m))){UI.act='mar';render();modal('Scan alert',`<div class="msg m-red"><b>${esc(x.label)}</b><br>${esc(x.allergy||x.wrong||'No active order for this product for this patient.')}</div><p>Return this medication. Do not administer.</p>`,'<button onclick="closeModal()">OK</button>');return;}
 const cands=medList(p.id).filter(m=>matches(x,m)).map(m=>({m,inst:pickInstance(p.id,m)})).filter(c=>c.inst);
 if(!cands.length){UI.act='mar';render();toast(`${x.label}: no remaining doses due today for this order.`);return;}
 cands.sort((a,b)=>(a.inst.due==null?1e9:Math.abs(a.inst.due-S.clock))-(b.inst.due==null?1e9:Math.abs(b.inst.due-S.clock)));
 const c=cands[0];UI.act='mar';render();admin(c.m.id,c.inst.key,c.inst.due);scanMed(i);}

/* ---------- Printable barcode labels ---------- */
function showLabels(){closeModal();UI.labels=true;render();}
function labelsView(){
 return `<div class="main"><div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Barcode labels</h2><button onclick="UI.labels=false;render()">← Back to chart</button></div>
 <p class="muted">Code 128 barcodes — readable by standard USB/Bluetooth handheld scanners. Use the printable PDF sheet for lab props; you can also test-scan straight from this screen.</p></div>
 ${PATIENTS.map(p=>`<div class="card"><h3>${esc(p.name)} · ${p.room}</h3>
 <div style="display:inline-block;border:2px solid #333;border-radius:8px;padding:8px 12px;margin:0 0 12px"><b>${esc(p.name)}</b> · ${p.sex} · DOB ${p.dob} · MRN ${p.mrn}${p.allergies.length?` · <span style="color:var(--red);font-weight:700">ALLERGY: ${esc(p.allergies.map(a=>a.agent).join(', '))}</span>`:''}<div>${code128svg(bandCode(p))}</div><div class="code">${bandCode(p)}</div></div>
 <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px">${[...p.drawer,vancPkg(p)].map(x=>`<div style="border:1px solid var(--line);border-radius:6px;padding:8px"><div style="font-weight:600;min-height:34px">${esc(x.label)}</div>${code128svg(x.code,40,1.4)}<div class="code">${x.code}</div></div>`).join('')}</div></div>`).join('')}</div>`;}

/* ---------- Start ---------- */
render();
if(!S.user){modal('Welcome to CareChart Academic',`<p>This is a practice electronic health record with fictional patients. Everything you chart is saved in this browser only.</p><label>Your name & credentials (used to sign your documentation)</label><input id="wn" style="width:100%" placeholder="e.g., J. Rivera, SN">`,
 `<button class="pri" onclick="S.user=document.getElementById('wn').value.trim()||'Student';save();closeModal();render()">Start shift</button>`);}
</script>
